name: E2E

# Ships the build across real Fleets (apps/e2e, ADR 0021): containers on
# Linux, and two users on one Mac.
# Slow, so it never blocks: it runs after a merge to main, by hand, or on a
# pull request labeled `e2e`.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Fleet
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: [--frozen-lockfile]
      # Builds the Machine image with layers cached between runs; the suite's
      # `compose up --build` then finds it built.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: ./apps/e2e/fleet
          files: ./compose.yaml
          targets: start
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - run: pnpm e2e
        env:
          # The fixtures come from this branch on GitHub.
          E2E_REF: ${{ github.head_ref || github.ref_name }}
          # The Starting Machine's gh token: the Lent Token, and the skills
          # Provider's GitHub API calls, which share a rate limit per IP without it.
          GH_TOKEN: ${{ github.token }}

  darwin:
    name: Darwin Fleet
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: [--frozen-lockfile]
      - run: pnpm e2e
        env:
          # The runner is the Starting Machine, and a second user on it the
          # other Machine (apps/e2e/fleet/darwin-setup.sh). It is thrown away.
          E2E_FLEET: darwin
          E2E_THROWAWAY: "1"
          E2E_REF: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
