packages:
  - apps/*
  - packages/*

# pnpm 11+: which dependencies may run build scripts.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true

catalog:
  "@base-ui/react": 1.9.0
  simple-icons: 16.35.0
  "@react-three/drei": 10.7.9
  "@react-three/fiber": 9.8.1
  "@effect/platform-node": 4.0.2
  "@effect/tsgo": 0.51.1
  "@effect/vitest": 4.0.2
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.42
  "@tanstack/react-start": 1.168.61
  "@types/node": 24.12.4
  "@types/three": 0.186.0
  "@types/mdx": 2.0.14
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/semver": 7.8.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  cn: 0.4.0
  effect: 4.0.2
  fumadocs-core: 16.17.3
  fumadocs-mdx: 15.4.7
  # The Base UI build of fumadocs-ui, the same primitives as packages/ui.
  fumadocs-ui: npm:@fumadocs/base-ui@16.17.3
  ink: 8.0.0
  jsonc-parser: 3.3.1
  lucide-react: 1.55.0
  motion: 14.1.0
  nitro: 3.0.260903-beta
  react: 19.3.0
  react-dom: 19.3.0
  semver: 7.8.5
  shadcn: 4.21.4
  tailwindcss: 4.3.3
  three: 0.186.1
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

minimumReleaseAgeExclude:
  - "@tanstack/history@1.162.5"
  - "@tanstack/react-router@1.170.42"
  - "@tanstack/react-start-client@1.168.40"
  - "@tanstack/react-start-rsc@0.1.60"
  - "@tanstack/react-start-server@1.167.47"
  - "@tanstack/react-start@1.168.61"
  - "@tanstack/router-core@1.171.35"
  - "@tanstack/router-generator@1.167.41"
  - "@tanstack/router-plugin@1.168.43"
  - "@tanstack/start-client-core@1.170.35"
  - "@tanstack/start-plugin-core@1.171.50"
  - "@tanstack/start-server-core@1.169.40"
  - "@tanstack/start-storage-context@1.167.37"

overrides:
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 1.1.0
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: npm:@voidzero-dev/vite-plus-core@1.1.0

# vitest's peer range names upstream vite; vite-plus-core is the Vite+ build of it.
peerDependencyRules:
  allowAny:
    - vite
