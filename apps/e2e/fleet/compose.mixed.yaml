# Joins the Linux Fleet to a mixed Fleet whose Starting Machine is a Tart VM
# (src/mixed.ts): the Machines' sshd and Verdaccio are published on Tart's
# bridge address (E2E_BRIDGE) only, which the host and its VMs reach and
# nothing on the host's own networks does. sshd's ports are fixed, so a
# Machine stopped and started again keeps its address.
services:
  verdaccio:
    ports: !override
      - "${E2E_BRIDGE:?}::4873"
  linux-b:
    ports:
      - "${E2E_BRIDGE:?}:${E2E_LINUX_B_PORT:?}:22"
  linux-c:
    ports:
      - "${E2E_BRIDGE:?}:${E2E_LINUX_C_PORT:?}:22"
